services:
  magento2-mcp-server:
    build: .
    container_name: magento2-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      # Simple check to see if the process is running
      test: ["CMD", "node", "-e", "require('./src/lib/mcp.js')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
