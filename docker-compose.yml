services:
  magento2-mcp-server:
    build: .
    container_name: magento2-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      # Pings the HTTP health endpoint. If the Node event loop hangs, this times out.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
